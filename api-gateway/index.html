<link rel="alternate" hreflang="ko" href="../ko/api-gateway/">
<link rel="alternate" hreflang="en" href="../en/api-gateway/">
<script>
/* language entry point: saved choice first, then the browser language; keeps ?query and #hash */
(function () {
  var p = null; try { p = localStorage.getItem('ans-lang'); } catch (e) {}
  var nl = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ko').toLowerCase();
  var l = (p === 'ko' || p === 'en') ? p : (nl.indexOf('ko') === 0 ? 'ko' : 'en');
  location.replace('../' + l + '/api-gateway/' + location.search + location.hash);
})();
</script>
